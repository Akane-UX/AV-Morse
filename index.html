<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AV Morse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased overflow-hidden selection:bg-zinc-800">
    <div id="app" class="relative w-full h-[100dvh] flex flex-col items-center justify-center p-6 md:p-12">
      
      <!-- Top header / status -->
      <header class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-xs font-medium tracking-widest text-zinc-400 uppercase">AV Morse</span>
        </div>
        <button id="cheatSheetBtn" class="flex items-center justify-center w-10 h-10 rounded-full bg-zinc-900 border border-white/5 hover:bg-zinc-800 transition-colors">
          <i data-lucide="book-open" class="w-4 h-4 text-zinc-400"></i>
        </button>
      </header>

      <!-- Main Display -->
      <main class="w-full max-w-2xl flex flex-col items-center justify-center flex-grow gap-8 z-0 mt-16 md:mt-0 pb-20">
        
        <!-- Output Box -->
        <div class="w-full flex flex-col bg-zinc-900/50 border border-white/5 rounded-3xl p-6 md:p-8 min-h-[240px] shadow-2xl transition-all">
          
          <!-- Live Input Preview -->
          <div class="flex items-center justify-between mb-6 border-b border-white/5 pb-4">
             <span class="text-xs font-medium text-zinc-500 tracking-widest uppercase">Live Input</span>
             <p id="morsePreview" class="text-xl text-emerald-400 tracking-widest font-mono h-7 empty:before:content-['...'] empty:before:text-zinc-700"></p>
          </div>

          <!-- Per-character History -->
          <div id="historyContainer" class="flex flex-wrap gap-2 md:gap-3 mb-6 empty:hidden">
            <!-- Handled by JS -->
          </div>

          <!-- Final Translated Text -->
          <div class="mt-auto pt-4">
            <span class="text-xs font-medium text-zinc-500 tracking-widest uppercase block mb-2">Translation</span>
            <h1 id="translatedText" class="text-3xl md:text-4xl font-medium tracking-tight text-zinc-100 break-words leading-snug empty:before:content-['Waiting_for_input...'] empty:before:text-zinc-700 empty:before:text-xl"></h1>
          </div>
        </div>

        <!-- Input Area (Mobile Button / Desktop Hint) -->
        <div class="mt-8 relative flex flex-col items-center justify-center w-full">
          <div id="desktopHint" class="flex flex-col items-center gap-3 mb-6">
            <div class="px-6 py-3 rounded-full bg-zinc-900 border border-white/5 text-zinc-400 text-sm tracking-wide text-center">
              Press <kbd class="px-2 py-1 mx-1 bg-zinc-800 rounded text-zinc-300 font-mono text-xs">SPACE</kbd> or click the button below
            </div>
          </div>
          
          <button id="mobileTapBtn" class="relative w-48 h-48 md:w-56 md:h-56 rounded-full bg-zinc-900 border border-white/5 shadow-2xl flex flex-col items-center justify-center select-none active:bg-zinc-800 overflow-hidden group cursor-pointer z-10">
            <div class="absolute inset-0 bg-white/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
            <div id="tapRipples" class="absolute inset-0 pointer-events-none"></div>
            <span class="text-sm font-medium tracking-widest text-zinc-500 pointer-events-none">TAP / HOLD</span>
          </button>
          
          <!-- Dynamic visual indicator for dot/dash -->
          <div id="signalIndicator" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-0 h-0 bg-zinc-100 rounded-full opacity-0 pointer-events-none"></div>
        </div>
      </main>
      
      <!-- Reset Button -->
      <div class="absolute bottom-6 md:bottom-12 z-10">
        <button id="clearBtn" class="px-6 py-2 rounded-full bg-zinc-900 border border-white/5 text-xs text-zinc-500 tracking-widest hover:text-zinc-300 hover:bg-zinc-800 transition-all opacity-0 pointer-events-none translate-y-4">
          RESET
        </button>
      </div>
      
      <!-- Cheat Sheet Drawer -->
      <div id="drawerOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity"></div>
      <div id="drawer" class="fixed bottom-0 left-0 w-full h-[85vh] bg-zinc-950 border-t border-white/10 rounded-t-[2rem] z-50 translate-y-full flex flex-col">
        <div class="w-full flex justify-center py-4 cursor-grab active:cursor-grabbing" id="drawerDragHandle">
          <div class="w-12 h-1.5 rounded-full bg-zinc-800"></div>
        </div>
        
        <div class="px-6 pb-6 pt-2 flex-grow overflow-y-auto">
          <h2 class="text-xl font-medium mb-6 text-zinc-100">Morse Code</h2>
          
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-x-4 gap-y-6">
            <!-- Populated via JS -->
            <div id="cheatSheetContent" class="col-span-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-x-4 gap-y-6"></div>
          </div>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
