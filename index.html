<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AV Morse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-zinc-800">
    <div id="app" class="relative w-full min-h-screen flex flex-col p-4 md:p-8">
      
      <!-- Top header / status -->
      <header class="w-full mb-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-xs font-medium tracking-widest text-zinc-400 uppercase">AV Morse</span>
        </div>
      </header>

      <!-- Main Layout -->
      <main class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow z-0 pb-16">
        
        <!-- Left Column: I/O & Interaction -->
        <div class="lg:col-span-2 flex flex-col gap-6">
          <!-- Output Box -->
          <div class="w-full flex flex-col bg-zinc-900/50 border border-white/5 rounded-2xl p-5 md:p-6 min-h-[160px] shadow-xl transition-all">
            <!-- Live Input Preview -->
            <div class="flex items-center justify-between mb-4 border-b border-white/5 pb-3">
               <span class="text-[10px] font-medium text-zinc-500 tracking-widest uppercase">Live Input</span>
               <p id="morsePreview" class="text-lg text-emerald-400 tracking-widest font-mono h-6 empty:before:content-['...'] empty:before:text-zinc-700"></p>
            </div>

            <!-- Per-character History -->
            <div id="historyContainer" class="flex flex-wrap gap-2 mb-4 empty:hidden">
              <!-- Handled by JS -->
            </div>

            <!-- Final Translated Text -->
            <div class="mt-auto pt-2">
              <span class="text-[10px] font-medium text-zinc-500 tracking-widest uppercase block mb-1">Translation</span>
              <h1 id="translatedText" class="text-2xl md:text-3xl font-medium tracking-tight text-zinc-100 break-words leading-snug empty:before:content-['Waiting_for_input...'] empty:before:text-zinc-700 empty:before:text-lg"></h1>
            </div>
          </div>

          <!-- Input Area -->
          <div class="relative flex flex-col items-center justify-center w-full bg-zinc-900/30 border border-white/5 rounded-2xl p-6">
            <div id="desktopHint" class="flex flex-col items-center gap-2 mb-4">
              <div class="px-4 py-2 rounded-full bg-zinc-900 border border-white/5 text-zinc-400 text-xs tracking-wide text-center">
                Press <kbd class="px-2 py-0.5 mx-1 bg-zinc-800 rounded text-zinc-300 font-mono">SPACE</kbd> or click button
              </div>
            </div>
            
            <button id="mobileTapBtn" class="relative w-32 h-32 md:w-40 md:h-40 rounded-full bg-zinc-900 border border-white/5 shadow-lg flex flex-col items-center justify-center select-none active:bg-zinc-800 overflow-hidden group cursor-pointer z-10 hover:border-white/10 transition-colors">
              <div class="absolute inset-0 bg-white/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
              <div id="tapRipples" class="absolute inset-0 pointer-events-none"></div>
              <span class="text-xs font-medium tracking-widest text-zinc-500 pointer-events-none">TAP</span>
            </button>
            
            <!-- Dynamic visual indicator for dot/dash -->
            <div id="signalIndicator" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-0 h-0 bg-zinc-100 rounded-full opacity-0 pointer-events-none"></div>
          </div>
        </div>

        <!-- Right Column: Permanent Cheat Sheet Table -->
        <div class="lg:col-span-1 flex flex-col bg-zinc-900/50 border border-white/5 rounded-2xl p-5 md:p-6 shadow-xl h-fit max-h-[80vh] overflow-hidden">
          <div class="flex items-center gap-2 mb-4 border-b border-white/5 pb-3">
            <i data-lucide="book-open" class="w-4 h-4 text-emerald-400"></i>
            <h2 class="text-sm font-medium text-zinc-100 uppercase tracking-widest">Cheat Sheet</h2>
          </div>
          
          <div class="flex-grow overflow-y-auto pr-2 custom-scrollbar">
            <!-- Populated via JS -->
            <div id="cheatSheetContent" class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-3 gap-2"></div>
          </div>
        </div>

      </main>
      
      <!-- Reset Button -->
      <div class="absolute bottom-6 md:bottom-12 z-10">
        <button id="clearBtn" class="px-6 py-2 rounded-full bg-zinc-900 border border-white/5 text-xs text-zinc-500 tracking-widest hover:text-zinc-300 hover:bg-zinc-800 transition-all opacity-0 pointer-events-none translate-y-4">
          RESET
        </button>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
